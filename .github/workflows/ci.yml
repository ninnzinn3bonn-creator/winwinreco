name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Update npm to match lockfile (npm 11.x lockfile)
        run: npm install -g npm@latest
      - name: Install dependencies
        # npm ci は package.json と package-lock.json の差分に厳格すぎて
        # ローカル (npm 11) と CI (Node 20 同梱の npm 10 → 11) で挙動差を起こす。
        # CI では npm install (--no-audit で audit を別ジョブに任せる) を使う。
        run: npm install --no-audit --no-fund
      - name: Frontend syntax check
        run: npm run check:frontend
      - name: Duplicate function check
        run: npm run check:duplicates
      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Update npm to match lockfile (npm 11.x lockfile)
        run: npm install -g npm@latest
      - name: Install dependencies
        # npm ci は package.json と package-lock.json の差分に厳格すぎて
        # ローカル (npm 11) と CI (Node 20 同梱の npm 10 → 11) で挙動差を起こす。
        # CI では npm install (--no-audit で audit を別ジョブに任せる) を使う。
        run: npm install --no-audit --no-fund
      - name: Security audit (production deps, critical severity)
        # 本番依存 (--omit=dev) に絞って critical のみ fail。
        # devDependencies (firebase-tools / playwright 等) の脆弱性は本番影響なし、
        # 開発時のみ。これらは Dependabot に任せる方針。
        # high 以下の transitive vuln は firebase-admin / @google-cloud/firestore /
        # protobufjs などのアップストリーム待ちが多く、breaking change を伴う
        # major upgrade なしでは fix 不可。Dependabot で順次対応する。
        # 一方 critical は即座にブロックする (新たな critical が混入したら main を
        # 守るため fail させる)。
        run: npm audit --omit=dev --audit-level=critical
