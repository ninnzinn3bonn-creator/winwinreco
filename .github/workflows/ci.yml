name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Frontend syntax check
        run: npm run check:frontend
      - name: Duplicate function check
        run: npm run check:duplicates
      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Security audit (high severity)
        # 'high' 以上の脆弱性が見つかったら fail
        run: npm audit --audit-level=high
