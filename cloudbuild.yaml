steps:
  # 1. Docker イメージをビルド
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/winwinreco:$COMMIT_SHA'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/winwinreco:latest'
      - '.'

  # 2. イメージを Artifact Registry へプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/winwinreco'

  # 3. Cloud Run へデプロイ
  #
  # 初回デプロイ後に Cloud Run URL を取得し、WS_ALLOWED_ORIGINS を実 URL に書き換えること:
  #   gcloud run services describe winwinreco --region=asia-northeast1 --format='value(status.url)'
  #
  # OWNER_EMAIL は自分のメールアドレスに書き換えること。
  # シークレット (GEMINI_API_KEY 等) は事前に Secret Manager に登録が必要:
  #   echo -n "$VALUE" | gcloud secrets create <name> --data-file=-
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - winwinreco
      - '--image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/winwinreco:$COMMIT_SHA'
      - '--region=asia-northeast1'
      - '--platform=managed'
      - '--quiet'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--concurrency=80'
      - '--memory=512Mi'
      # ★ OWNER_EMAIL と WS_ALLOWED_ORIGINS は実値に書き換えてコミット
      - '--set-env-vars=DB_DRIVER=firestore,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,AI_PROVIDER=gemini,STT_PROVIDER=google,STT_LANGUAGE=ja,COOKIE_SECURE=true,PORT=8080,WS_ALLOWED_ORIGINS=https://REPLACE_WITH_YOUR_CLOUD_RUN_URL,OWNER_EMAIL=REPLACE_WITH_YOUR_EMAIL'
      # ★ Secret Manager に登録したシークレット名と一致させること
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest,GOOGLE_API_KEY=google-api-key:latest,GROQ_API_KEY=groq-api-key:latest'

images:
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/winwinreco:$COMMIT_SHA'
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/winwinreco:latest'

options:
  logging: CLOUD_LOGGING_ONLY
