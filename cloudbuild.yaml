steps:
  # 1. Docker イメージをビルド
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/winwinreco:$COMMIT_SHA'
      - '-t'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/winwinreco:latest'
      - '.'

  # 2. イメージを Artifact Registry へプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/winwinreco'

  # 3. Cloud Run へデプロイ
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - winwinreco
      - '--image=asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/winwinreco:$COMMIT_SHA'
      - '--region=asia-northeast1'
      - '--platform=managed'
      - '--quiet'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--concurrency=80'
      - '--memory=512Mi'
      - '--set-env-vars=DB_DRIVER=firestore,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,AI_PROVIDER=gemini,STT_PROVIDER=google,STT_LANGUAGE=ja,COOKIE_SECURE=true,PORT=8080,WS_ALLOWED_ORIGINS=https://winwinreco-cg57pktjvq-an.a.run.app,OWNER_EMAIL=ninnzinn.3bonn@gmail.com'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest,GOOGLE_API_KEY=google-api-key:latest,GROQ_API_KEY=groq-api-key:latest,ELEVENLABS_API_KEY=elevenlabs-api-key:latest'

images:
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/winwinreco:$COMMIT_SHA'
  - 'asia-northeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/winwinreco:latest'

options:
  logging: CLOUD_LOGGING_ONLY
