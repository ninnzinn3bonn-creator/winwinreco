<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>対面会議 議事録アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Mobile Debug Monitor (Overlay) -->
    <div id="debug-monitor" class="debug-monitor hidden">
        <div class="debug-header">
            <div class="debug-stats">
                <span>🎤 Mic: <span id="debug-mic-status">不明</span></span> | 
                <span>⚡ Ping: <span id="debug-ping">---</span>ms</span> | 
                <span>🚨 Err: <span id="debug-error-count">0</span></span>
            </div>
            <div class="debug-actions">
                <button id="btn-debug-clear" title="ログをクリア">🧹</button>
                <button id="btn-debug-copy" title="ログをコピー">📝</button>
                <button id="btn-debug-download" title="ログをJSON保存">💾</button>
                <button id="btn-debug-toggle" title="閉じる">×</button>
            </div>
        </div>
        <div id="debug-log-view" class="debug-log-view">
            <!-- ログがここに動的に追加される -->
        </div>
    </div>
    <!-- Floating toggle button for debug monitor -->
    <button id="btn-debug-float" class="debug-float-btn" title="デバッグを開く">🛠️</button>

    <div id="app">
        <!-- 画面①: ルーム作成・参加 -->
        <section id="setup-screen" class="active">
            <h1>会議に参加する</h1>
            <div class="form-group">
                <label for="display-name">表示名</label>
                <input type="text" id="display-name" placeholder="例: 山田 太郎">
            </div>
            <div class="form-group">
                <label for="room-id">場所ID / ルームID</label>
                <input type="text" id="room-id" placeholder="例: room-123">
            </div>
            
            <div id="api-status-container" class="api-status">
                <p>設定状況を確認中...</p>
            </div>

            <div class="ai-config-group">
                <h3>AIエンジン設定</h3>
                <div class="form-group-row">
                    <select id="ai-provider">
                        <option value="gemini">Gemini (クラウド)</option>
                        <option value="ollama">Ollama (ローカル)</option>
                    </select>
                    <input type="text" id="ai-model" placeholder="モデル名 (例: gemini-2.5-flash)" value="gemini-2.5-flash">
                </div>
            </div>

            <div class="actions">
                <button id="btn-create" class="primary">新しくルームを作る</button>
                <button id="btn-join">既存のルームに入る</button>
            </div>
        </section>

        <!-- 画面②: 録音・ログ画面 -->
        <section id="meeting-screen">
            <header>
                <div class="status">
                    <span class="recording-indicator"></span>
                    <span id="room-info">ルーム: ---</span>
                    <button id="btn-copy-room" class="icon-btn" title="ルームIDをコピー">📋</button>
                    <button id="btn-download" class="icon-btn" title="議事録をダウンロード">📥</button>
                </div>
                <button id="btn-end" class="danger">終了</button>
            </header>

            <div id="topic-tree-container">
                <div class="container-label">トピックツリー</div>
                <div id="topic-tree-content" class="tree-nodes">
                    <!-- 解析されたノードがここにカード形式で入る -->
                    <span class="placeholder-text">解析ボタンを押すと生成されます</span>
                </div>
            </div>

            <div id="resizer" class="resizer-handle"></div>

            <main id="timeline">
                <!-- 発話ログがここに挿入される -->
                <div class="system-message">接続を待機しています...</div>
            </main>

            <footer id="meeting-footer">
                <div class="footer-actions">
                    <button id="btn-analyze" class="secondary">解析</button>
                    <button id="btn-memo" class="secondary">メモ</button>
                    <button id="btn-save" class="secondary">保存</button>
                </div>
                <div id="self-info">参加者: ---</div>
            </footer>
        </section>

        <!-- 画面③: 会議終了サマリー -->
        <section id="summary-screen">
            <h1>会議が終了しました</h1>
            <p id="summary-info">ルーム: ---</p>
            
            <div class="tabs">
                <button id="tab-log" class="tab-btn active">全ログ</button>
                <button id="tab-ai" class="tab-btn">AI解析</button>
            </div>

            <div id="summary-content">
                <div id="panel-log" class="tab-panel active">
                    <div id="summary-log" class="timeline-preview">
                        <!-- 最終的なログがここに表示される -->
                    </div>
                </div>

                <div id="panel-ai" class="tab-panel">
                    <div class="ai-controls">
                        <button id="btn-ai-summary" class="secondary">要約生成</button>
                        <button id="btn-ai-agenda" class="secondary">決定事項/TODO</button>
                    </div>
                    <div class="ai-custom">
                        <textarea id="ai-instruction" placeholder="AIへのカスタム指示（例：この会議の懸念点をまとめて）"></textarea>
                        <button id="btn-ai-custom">実行</button>
                    </div>
                    <div id="ai-result" class="ai-preview">
                        AIによる解析結果がここに表示されます。
                    </div>
                </div>
            </div>

            <div class="actions">
                <button id="btn-download-final" class="primary">議事録をダウンロード (.md)</button>
                <button id="btn-home">ホームに戻る</button>
            </div>
        </section>
    </div>
    <script src="debug.js"></script>
    <script src="main.js"></script>
</body>
</html>
